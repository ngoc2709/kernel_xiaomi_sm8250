name: Build KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl bc cpio flex bison libssl-dev libelf-dev python3 python-is-python3

      - name: Integrate KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Download Clang Toolchain
        run: |
          mkdir -p clang
          cd clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz --strip-components=1

      - name: Build Kernel Image
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Cấu hình defconfig cho thiết bị (Thay alioth_defconfig nếu dùng máy khác)
          make O=out ARCH=arm64 vendor/alioth_defconfig
          
          # Kích hoạt kprobe cho KernelSU
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelImage-KernelSU
          path: out/arch/arm64/boot/Image*
