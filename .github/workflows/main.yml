name: Build KernelSU-Next LKM for Redmi K40 (TWRP/OrangeFox)

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/diphons/kernel_xiaomi_sm8250.git
  KERNEL_BRANCH: staging8
  ZIP_NAME: KernelSU-Next-LKM-RedmiK40-OrangeFox.zip
  KERNEL_DIR: ${{ github.workspace }}/kernel_workspace
  CLANG_DIR: ${{ github.workspace }}/clang/proton-clang

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Clean old workspace
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "${GITHUB_WORKSPACE}/kernel_workspace" "${GITHUB_WORKSPACE}/clang" "${GITHUB_WORKSPACE}/AnyKernel3"
          mkdir -p "${GITHUB_WORKSPACE}/clang"

      - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_REPO}" "${KERNEL_DIR}"
          cd "${KERNEL_DIR}"
          git rev-parse --short HEAD

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential bison curl flex git libelf-dev \
            libncurses5-dev libssl-dev llvm lld clang ccache \
            ca-certificates zip unzip wget

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "${CLANG_DIR}"
          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Install KernelSU-Next
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"
          # Use the branch that exists in KernelSU-Next repo
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s next

      - name: Validate alioth config exists
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          REQUIRED_CONFIG="arch/arm64/configs/vendor/xiaomi/alioth.config"
          if [ ! -f "${REQUIRED_CONFIG}" ]; then
            echo "Missing required config: ${REQUIRED_CONFIG}"
            echo "Available files under vendor:"
            find arch/arm64/configs/vendor -maxdepth 2 -type f | sort || true
            exit 1
          fi

          echo "Found config: ${REQUIRED_CONFIG}"

      - name: Prepare alioth defconfig for LKM
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          mkdir -p arch/arm64/configs/vendor
          cp arch/arm64/configs/vendor/xiaomi/alioth.config arch/arm64/configs/vendor/alioth_defconfig

          cat >> arch/arm64/configs/vendor/alioth_defconfig <<'EOF'
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SIG=n
          EOF

          echo "Kernel module config enabled:"
          grep -E 'CONFIG_MODULES|CONFIG_MODULE_UNLOAD|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG' arch/arm64/configs/vendor/alioth_defconfig || true

      - name: Clean previous build
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"
          rm -rf out
          make clean || true
          make mrproper || true || true

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          # Build config
          make O=out ARCH=arm64 vendor/alioth_defconfig

          # Important: keep host tools on system GCC, only target compile uses clang/ld.lld
          # This avoids the /lib64/ld-linux-x86-64.so.2 linker error from Proton Clang host tools
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Check kernel image exists
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Found kernel image: out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Found kernel image: out/arch/arm64/boot/Image.gz"
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Found kernel image: out/arch/arm64/boot/Image"
          else
            echo "Kernel image not found."
            find out -maxdepth 5 -type f | head -100 || true
            exit 1
          fi

      - name: Package flashable zip with AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          if [ -d "AnyKernel3" ]; then
            echo "AnyKernel3 already exists"
          else
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "Kernel image missing for zip packaging"
            exit 1
          fi

          cat > AnyKernel3/anykernel.sh <<'EOF'
          #!/bin/bash
          # AnyKernel3 script for TWRP/OrangeFox
          # Redmi K40 (alioth)
          #
          # KernelSU-Next LKM
          # Flashable zip for recovery installation

          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=alioth
          device.name2=alioth

          if [ -f "Image.gz-dtb" ]; then
            kernelfile="Image.gz-dtb"
          elif [ -f "Image.gz" ]; then
            kernelfile="Image.gz"
          elif [ -f "Image" ]; then
            kernelfile="Image"
          else
            abort "Kernel image not found"
          fi

          ui_print "Using $kernelfile"
          EOF

          chmod 755 AnyKernel3/anykernel.sh

          cd AnyKernel3
          rm -f README.md 2>/dev/null || true
          rm -f .gitignore 2>/dev/null || true
          zip -r9 "../${ZIP_NAME}" . -x .git README.md .gitignore

          cd ..
          ls -lh "${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-LKM-RedmiK40-OrangeFox-${{ github.run_number }}
          path: ${{ env.KERNEL_DIR }}/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14
