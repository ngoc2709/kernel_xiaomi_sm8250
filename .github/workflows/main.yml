name: Build KernelSU-Next LKM for Redmi K40

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Tối ưu dung lượng ổ đĩa
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Cài đặt các gói phụ thuộc
      run: |
        sudo apt update
        sudo apt install -y bc build-essential libncurses5-dev binfmt-support libssl-dev ccache git curl wget unzip bison flex libelf-dev clang llvm lld

    - name: Tải trình biên dịch Clang (Proton Clang)
      run: |
        mkdir -p clang
        cd clang
        # Chuyển sang tải Proton Clang từ nguồn ổn định trên GitHub để sửa lỗi 400 Bad Request
        wget https://github.com
        unzip master.zip
        # Đưa đường dẫn thực thi vào môi trường hệ thống
        echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH

    - name: Tải mã nguồn Kernel Xiaomi SM8250 (Nhánh staging8 cho HyperOS)
      run: |
        git clone https://github.com -b staging8 --depth=1 kernel_workspace

    - name: Tích hợp KernelSU-Next mới nhất
      run: |
        cd kernel_workspace
        curl -LSs "https://githubusercontent.com" | bash -s main

    - name: Cấu hình bật chế độ LKM cho Redmi K40
      run: |
        cd kernel_workspace
        # Thêm các cấu hình LKM bắt buộc vào defconfig của K40
        echo "CONFIG_MODULES=y" >> arch/arm64/configs/vendor/alioth_defconfig
        echo "CONFIG_MODULE_UNLOAD=y" >> arch/arm64/configs/vendor/alioth_defconfig
        echo "CONFIG_MODVERSIONS=y" >> arch/arm64/configs/vendor/alioth_defconfig
        echo "CONFIG_MODULE_SIG=n" >> arch/arm64/configs/vendor/alioth_defconfig

    - name: Tiến hành Biên dịch Kernel
      run: |
        cd kernel_workspace
        export PATH="$PATH"
        make O=out ARCH=arm64 vendor/alioth_defconfig
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip

    - name: Đóng gói thành file Flash .zip (AnyKernel3)
      run: |
        cd kernel_workspace
        cd AnyKernel3
        cp ../out/arch/arm64/boot/Image.gz-dtb . || cp ../out/arch/arm64/boot/Image.gz . || cp ../out/arch/arm64/boot/Image .
        zip -r9 ../../KernelSU-Next-LKM-RedmiK40.zip * -x .git README.md

    - name: Tải thành phẩm lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-LKM-Alioth
        path: KernelSU-Next-LKM-RedmiK40.zip
