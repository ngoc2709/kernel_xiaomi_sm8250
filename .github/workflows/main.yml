name: Build KernelSU-Next LKM for Redmi K40 (TWRP/OrangeFox)

on:
  workflow_dispatch:

concurrency:
  group: kernel-build-alioth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/EmanuelCN/kernel_xiaomi_sm8250.git
  KERNEL_BRANCH: staging
  ZIP_NAME: KernelSU-Next-LKM-RedmiK40-OrangeFox.zip
  KERNEL_DIR: ${{ github.workspace }}/kernel_workspace
  KSU_DIR: ${{ github.workspace }}/KernelSU-Next

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean workspace
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "${GITHUB_WORKSPACE}/kernel_workspace" "${GITHUB_WORKSPACE}/KernelSU-Next" "${GITHUB_WORKSPACE}/AnyKernel3"
          mkdir -p "${GITHUB_WORKSPACE}"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: ccache-kernel-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-kernel-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-
            ccache-kernel-${{ runner.os }}-

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison curl flex git libelf-dev \
            libncurses5-dev libssl-dev llvm lld clang \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            ca-certificates zip unzip wget ccache
          echo "CCACHE_DIR=${HOME}/.ccache" >> "${GITHUB_ENV}"
          ccache --zero-stats
          ccache --max-size=2G

      - name: Validate kernel repo and branch
        shell: bash
        run: |
          set -euxo pipefail
          git ls-remote --heads "${KERNEL_REPO}" "refs/heads/${KERNEL_BRANCH}" >/dev/null
          echo "Kernel repo and branch are reachable: ${KERNEL_REPO} (${KERNEL_BRANCH})"

      - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_REPO}" "${KERNEL_DIR}"
          cd "${KERNEL_DIR}"
          git rev-parse --short HEAD

      - name: Clone KernelSU-Next source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git "${KSU_DIR}"
          cd "${KSU_DIR}"
          git rev-parse --short HEAD

      - name: Install KernelSU-Next into kernel tree
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"
          bash "${KSU_DIR}/kernel/setup.sh"

      - name: Validate alioth config
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          CANDIDATES=()
          while IFS= read -r f; do
            CANDIDATES+=("$f")
          done < <(find arch -type f \( -iname 'alioth*.config' -o -path '*/vendor/*/alioth.config' -o -path '*/vendor/xiaomi/alioth.config' \) 2>/dev/null | sort)

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "Missing required alioth config. Searched under arch/ for alioth*.config or vendor/xiaomi/alioth.config"
            find arch -maxdepth 5 -type f 2>/dev/null | grep -Ei 'alioth|xiaomi|vendor' | head -200 || true
            exit 1
          fi

          echo "Found alioth config candidates:"
          printf '%s\n' "${CANDIDATES[@]}"
          echo "KERNEL_CONFIG_SOURCE=${CANDIDATES[0]}" >> "${GITHUB_ENV}"

      - name: Prepare alioth defconfig for LKM
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          mkdir -p arch/arm64/configs/vendor

          CONFIG_SOURCE="${KERNEL_CONFIG_SOURCE:-arch/arm64/configs/vendor/xiaomi/alioth.config}"
          if [ ! -f "${CONFIG_SOURCE}" ]; then
            echo "Configured source config does not exist: ${CONFIG_SOURCE}"
            exit 1
          fi

          cp "${CONFIG_SOURCE}" arch/arm64/configs/vendor/alioth_defconfig

          # Fix invalid empty CPU mask entries that break Kconfig sync
          for sym in LITTLE BIG PRIME; do
            sed -i "/^CONFIG_${sym}_CPU_MASK=/d" arch/arm64/configs/vendor/alioth_defconfig || true
          done

          cat >> arch/arm64/configs/vendor/alioth_defconfig <<'EOF'
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SIG=n
          EOF

          echo "Module-related config:"
          grep -E 'CONFIG_MODULES|CONFIG_MODULE_UNLOAD|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG' arch/arm64/configs/vendor/alioth_defconfig || true

          echo "Any CPU mask entries remaining:"
          grep -nE 'CONFIG_(LITTLE|BIG|PRIME)_CPU_MASK' arch/arm64/configs/vendor/alioth_defconfig || true

      - name: Clean old build outputs
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"
          rm -rf out
          make clean || true
          make mrproper || true || true

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          export PATH="/usr/lib/ccache:${PATH}"
          export CCACHE_DIR="${HOME}/.ccache"

          # Build defconfig from sanitized vendor config
          make O=out ARCH=arm64 vendor/alioth_defconfig

          # Remove any generated invalid values from generated .config
          for sym in LITTLE BIG PRIME; do
            sed -i "/^CONFIG_${sym}_CPU_MASK=/d" out/.config || true
          done

          # Regenerate config from sanitized state
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          export PATH="/usr/lib/ccache:${PATH}"
          export CCACHE_DIR="${HOME}/.ccache"

          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

          ccache --show-stats || true

      - name: Validate output image
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel image found: out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Kernel image found: out/arch/arm64/boot/Image.gz"
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Kernel image found: out/arch/arm64/boot/Image"
          else
            echo "Kernel image not found!"
            find out -maxdepth 5 -type f | head -100 || true
            exit 1
          fi

      - name: Package flashable zip with AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          cd "${KERNEL_DIR}"

          if [ -d "AnyKernel3" ]; then
            echo "AnyKernel3 exists"
          else
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "Kernel image missing for packaging"
            exit 1
          fi

          cat > AnyKernel3/anykernel.sh <<'EOF'
          #!/bin/bash
          # AnyKernel3 script for TWRP/OrangeFox
          # Redmi K40 (alioth)
          #
          # KernelSU-Next LKM
          # Flashable zip for recovery installation

          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=alioth
          device.name2=alioth

          if [ -f "Image.gz-dtb" ]; then
            kernelfile="Image.gz-dtb"
          elif [ -f "Image.gz" ]; then
            kernelfile="Image.gz"
          elif [ -f "Image" ]; then
            kernelfile="Image"
          else
            abort "Kernel image not found"
          fi

          ui_print "Using $kernelfile"
          EOF

          chmod 755 AnyKernel3/anykernel.sh

          cd AnyKernel3
          rm -f README.md 2>/dev/null || true
          rm -f .gitignore 2>/dev/null || true
          zip -r9 "../${ZIP_NAME}" . -x .git README.md .gitignore

          cd ..
          ls -lh "${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-LKM-RedmiK40-OrangeFox-${{ github.run_number }}
          path: ${{ env.KERNEL_DIR }}/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14
